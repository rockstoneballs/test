<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story not found · Sunnyside</title>
  <meta name="theme-color" content="#F76707">
  <style>
    :root { --bg: #f6f3ee; --text: #1f1b16; --text-2: #5b5047; --brand: #f76707; --on-brand: #fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0d0b; --text: #f1e9df; --text-2: #c4b7a8; --brand: #ff922b; --on-brand: #1a0e02; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { padding: 32px 16px; max-width: 420px; }
    .big { font-size: 56px; }
    h1 { margin: 8px 0; font-size: 24px; }
    p { color: var(--text-2); margin: 0 0 20px; }
    a { display: inline-block; padding: 10px 20px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="big">🌤️</div>
    <h1 id="title">This page has drifted away</h1>
    <p id="body">It may have moved, or it's older than we keep. There's plenty more good news waiting.</p>
    <a id="home" href="/">See today's good news</a>
  </main>
  <script>
    // GitHub Pages serves this for any missing path; find the site's home (e.g. /test/).
    const base = "/" + (location.pathname.split("/")[1] || "") + "/";
    document.getElementById("home").href = base;
    if (/\/s\/[0-9a-f]{16}\/?$/.test(location.pathname)) {
      document.getElementById("title").textContent = "That story has drifted away";
      document.getElementById("body").textContent = "Shared stories stay up for about a month. There's plenty more good news waiting.";
    }
  </script>
</body>
</html>
