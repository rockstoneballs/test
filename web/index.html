<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunnyside — only good news</title>
  <meta name="description" content="Good news from around the world, wholesome memes, and a kitten and puppy of the day. Start your morning on the sunny side.">
  <meta name="theme-color" content="#F76707">
  <meta property="og:title" content="Sunnyside — only good news">
  <meta property="og:description" content="Good news from around the world, wholesome memes, and a kitten and puppy of the day.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("sunnyside.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to posts</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open communities" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Sunnyside home">
      <img src="icon.svg" alt="" width="32" height="32"><span>sunnyside</span>
    </a>
    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search-input" type="search" placeholder="Search good news" aria-label="Search good news" autocomplete="off">
    </form>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode"></button>
      <a class="btn btn-primary get-app" id="get-app" href="https://github.com/rockstoneballs/test/releases/latest/download/sunnyside.apk">Get the app</a>
    </div>
  </header>

  <div class="layout">
    <nav class="left-nav" id="left-nav" aria-label="Feeds and communities"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" tabindex="-1"></main>
    <aside class="right-rail" id="right-rail" aria-label="Today"></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
