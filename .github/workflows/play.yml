name: Publish to Google Play

# Run by hand (Actions → Publish to Google Play → Run workflow). Builds a signed Android
# App Bundle and uploads it to a Google Play track. See android/play/README.md.
#
# Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     the upload key (Google Play re-signs the app with its own key).
#   PLAY_SERVICE_ACCOUNT_JSON (optional)
#     a Google Cloud service account with release access in Play Console. Without it the
#     bundle is only built and attached to the run, ready to upload by hand (Google requires
#     the very first upload of a new app to be done by hand anyway).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status. Use 'draft' until the app has passed its first review."
        type: choice
        options: [draft, completed]
        default: draft

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets first (see android/play/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SUNNYSIDE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "SUNNYSIDE_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Build the bundle
        env:
          SUNNYSIDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUNNYSIDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUNNYSIDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUNNYSIDE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
        run: ./gradlew --no-daemon testReleaseUnitTest bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sunnyside-play-bundle
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Check for a Play service account
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret: the bundle is attached to this run to upload by hand."
          fi
      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.sunnyside.news
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: android/play/whatsnew
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
