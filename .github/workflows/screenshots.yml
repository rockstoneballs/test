name: Play Store screenshots

# Takes phone screenshots of the app on an emulator, for the Play Store listing. Run it by
# hand (Actions → Play Store screenshots → Run workflow) after visible changes. On a branch
# other than main the screenshots are committed to android/play/screenshots; they're always
# attached to the run as well.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/screenshots.yml", "android/play/screenshots.sh"]

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: android
        # A release build, so screenshots never show test ads (it has none until AdMob is set up).
        run: ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # 1080×1920 (16:9): Play rejects screenshots more than twice as tall as they are wide.
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./android/play/screenshots.sh android/app/build/outputs/apk/release/app-release.apk android/play/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: play-screenshots
          path: android/play/screenshots/*.png
          if-no-files-found: error
      - name: Commit the screenshots
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/play/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update Play Store screenshots"
          git push
