name: Firebase

# Tests Sunnyside's server code (firebase/functions) on every change, and deploys it with the
# Firestore security rules on main once Firebase is set up (see android/play/README.md):
#   secret   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account allowed to deploy
#   variable FIREBASE_PROJECT_ID       the Firebase project id
on:
  push:
    paths: ["firebase/**", ".github/workflows/firebase.yml"]
  pull_request:
    paths: ["firebase/**", ".github/workflows/firebase.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check the functions load
        run: GCLOUD_PROJECT=demo-test node -e "import('./index.js')"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Firebase is set up
        id: setup
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJECT" ]; then
            echo "::notice::Firebase isn't set up yet (FIREBASE_SERVICE_ACCOUNT secret / FIREBASE_PROJECT_ID variable), so nothing was deployed."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy functions and security rules
        if: steps.setup.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          (cd functions && npm ci --omit=dev)
          npx --yes firebase-tools@15 deploy --only functions,firestore:rules --project "$PROJECT" --non-interactive --force
