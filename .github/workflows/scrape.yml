name: Scrape good news

# Scrapes good-news stories + picks the kitten and puppy of the day, then
# publishes feed.json to GitHub Pages for the app to download.
on:
  schedule:
    - cron: "17 */2 * * *" # every two hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/scrape.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Scrape
        working-directory: scraper
        env:
          # Optional. With a key, Claude judges which stories are genuinely good news;
          # without one, keyword filtering is used.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m goodnews.scrape --out ../site --previous "${{ steps.pages.outputs.base_url }}/feed.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
