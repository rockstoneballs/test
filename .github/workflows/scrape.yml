name: Scrape good news

# Every 30 minutes: scrape good-news stories, wholesome memes and cute animals, pick the
# kitten and puppy of the day, and publish the website + feed.json to GitHub Pages.
# On branches other than main it runs the same scrape as a dry run (no deploy) and uploads
# the result as an artifact, so changes to sources can be checked before merging.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: ["scraper/**", "web/**", ".github/workflows/scrape.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Build site
        env:
          # Optional Actions variable: where the feedback form sends messages (e.g. a Formspree
          # form URL). Without it the form opens a pre-filled GitHub issue.
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
        run: |
          mkdir -p site
          cp -r web/. site/
          python3 - <<'PY'
          import json, os
          config = {"feedbackUrl": os.environ.get("FEEDBACK_URL", ""), "repo": os.environ["GITHUB_REPOSITORY"]}
          with open("site/config.js", "w") as f:
              f.write("window.SUNNYSIDE_CONFIG = " + json.dumps(config) + ";\n")
          PY
      - name: Scrape
        working-directory: scraper
        env:
          # All optional. With an Anthropic key, Claude judges which stories are genuinely good
          # news (otherwise keyword filtering is used). Reddit credentials make Reddit reliable
          # from GitHub's servers; an Imgur Client-ID turns on Imgur. 9GAG and Lemmy need nothing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
        run: >-
          python -m goodnews.scrape --out ../site
          --previous "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.json"
          ${{ github.ref != 'refs/heads/main' && '--list-news' || '' }}
      - name: Preview (non-main branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
